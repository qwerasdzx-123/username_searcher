<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户名检索工具 | Username Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <span class="title-icon">🔍</span>
                    用户名检索工具
                </h1>
                <p class="subtitle">快速检测用户名在各社交平台的注册情况</p>
            </div>
        </header>

        <main class="main">
            <section class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="usernameInput" 
                        class="search-input" 
                        placeholder="输入要搜索的用户名..."
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="search-btn">
                        <span class="btn-text">开始搜索</span>
                        <span class="btn-icon">🚀</span>
                    </button>
                </div>
                <div class="search-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="filterNSFW">
                        <span class="checkbox-text">过滤成人内容</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="onlyPopular" checked>
                        <span class="checkbox-text">仅显示热门网站</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="testMode">
                        <span class="checkbox-text">测试模式（仅测试前5个网站）</span>
                    </label>
                    <!-- 查询模式切换 -->
                    <div class="mode-switch-group">
                        <span class="mode-label">查询模式:</span>
                        <label class="mode-option">
                            <input type="radio" name="searchMode" value="precise" checked>
                            <span class="mode-text">精准匹配</span>
                        </label>
                        <label class="mode-option">
                            <input type="radio" name="searchMode" value="fuzzy">
                            <span class="mode-text">模糊匹配</span>
                        </label>
                    </div>
                    <!-- 代理模式切换 -->
                    <div class="mode-switch-group">
                        <span class="mode-label">代理模式:</span>
                        <label class="mode-option">
                            <input type="radio" name="proxyMode" value="local-proxy" checked>
                            <span class="mode-text">本地代理</span>
                        </label>
                        <label class="mode-option">
                            <input type="radio" name="proxyMode" value="direct">
                            <span class="mode-text">直连模式</span>
                        </label>
                    </div>
                    <!-- 并发数设置 -->
                    <div class="mode-switch-group">
                        <span class="mode-label">并发数:</span>
                        <input type="number" id="concurrencyInput" class="concurrency-input" min="1" max="20" value="3" title="设置同时查询的网站数量（1-20），数值越低越稳定">
                        <span class="mode-text" style="font-size:0.75rem;opacity:0.7;">(1-20, 越低越稳)</span>
                    </div>
                </div>
            </section>

            <section class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progressText">正在搜索...</span>
                        <span id="progressCount">0/0</span>
                    </div>
                </div>
                <div class="debug-info" id="debugInfo" style="display: none;">
                    <div class="debug-title">调试信息</div>
                    <div class="debug-content" id="debugContent"></div>
                </div>
            </section>

            <section class="stats-section" id="statsSection" style="display: none;">
                <div class="stats-grid">
                    <div class="stat-card found">
                        <div class="stat-icon">✓</div>
                        <div class="stat-value" id="foundCount">0</div>
                        <div class="stat-label">已注册</div>
                    </div>
                    <div class="stat-card not-found">
                        <div class="stat-icon">✗</div>
                        <div class="stat-value" id="notFoundCount">0</div>
                        <div class="stat-label">未注册</div>
                    </div>
                    <div class="stat-card checked">
                        <div class="stat-icon">📊</div>
                        <div class="stat-value" id="checkedCount">0</div>
                        <div class="stat-label">已检测</div>
                    </div>
                    <div class="stat-card error">
                        <div class="stat-icon">⚠</div>
                        <div class="stat-value" id="errorCount">0</div>
                        <div class="stat-label">检测失败</div>
                    </div>
                </div>
            </section>

            <section class="results-section" id="resultsSection" style="display: none;">
                <div class="results-header">
                    <h2 class="results-title">搜索结果</h2>
                    <div class="results-actions">
                        <select id="filterSelect" class="filter-select">
                            <option value="all">全部</option>
                            <option value="found">已注册</option>
                            <option value="not-found">不存在</option>
                            <option value="manual-verify">需手工验证</option>
                            <option value="error">错误信息</option>
                        </select>

                    </div>
                </div>
                <div class="results-list" id="resultsList"></div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
